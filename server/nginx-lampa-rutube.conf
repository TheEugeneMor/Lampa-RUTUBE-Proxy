# Lampa RUTUBE Proxy nginx snippet
# Автор: Eugene Pchelnikov
# Связь в Telegram: https://t.me/eugenemor
#
# Как использовать:
# 1. Скопируйте содержимое папки server в document root сайта.
# 2. Подключите этот файл внутри server { ... } вашего nginx-сайта:
#      include /path/to/server/nginx-lampa-rutube.conf;
# 3. Проверьте путь fastcgi_pass ниже и замените его под вашу систему.
#
# Примеры fastcgi_pass:
#   Debian/Ubuntu PHP 8.3: unix:/run/php/php8.3-fpm.sock
#   Debian/Ubuntu PHP 8.2: unix:/run/php/php8.2-fpm.sock
#   TCP PHP-FPM: 127.0.0.1:9000

index status.php index.php;

location = /rutube-cors.js {
    rewrite ^ /plugin.php last;
}

location = /rt.js {
    rewrite ^ /plugin.php last;
}

location = /hls-proxy.m3u8 {
    rewrite ^ /hls.php last;
}

location / {
    try_files $uri $uri/ /status.php;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
